<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>BITEit — Browse. Choose. Savor.</title>
  <meta name="description" content="BITEit — Browse. Choose. Savor. Digital menu and instant WhatsApp ordering.">
  <meta name="theme-color" content="#14170F">

  <!-- Google Fonts: Fraunces (dish names/headers), Mulish (UI), JetBrains Mono (prices/numbers),
       Noto Kufi Arabic (Arabic text — Fraunces/Mulish have no Arabic glyphs at all, so without this
       any Arabic string would silently fall back to the browser's default Arabic font and look
       visually inconsistent with the rest of the design). Only loaded/applied when Arabic is active
       — see the .font-arabic rule below and the isArabic-driven class binding on <body>. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Mulish:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    /* MULTI-CUISINE THEME ENGINE
       Every color token below resolves to `rgb(var(--color-X-rgb) / <alpha-value>)` instead of a
       fixed hex value. Tailwind's `<alpha-value>` placeholder is a literal string it recognizes:
       when you write `bg-saffron/40` in markup, Tailwind swaps <alpha-value> for 0.4 at the CSS
       level — so every existing utility class (including every /NN opacity variant already used
       throughout this file) keeps working completely unchanged. The actual RGB numbers live in
       CSS custom properties defined in the <style> block below, under :root (Indian, default) and
       two [data-theme="..."] overrides (Italian, Emirati). Switching cuisine only ever changes
       which set of --color-*-rgb values is active — zero HTML/class edits needed to reskin. */
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'ink': 'rgb(var(--color-ink-rgb) / <alpha-value>)',
            'surface': 'rgb(var(--color-surface-rgb) / <alpha-value>)',
            'surface-raised': 'rgb(var(--color-surface-raised-rgb) / <alpha-value>)',
            'surface-sunken': 'rgb(var(--color-surface-sunken-rgb) / <alpha-value>)',
            'border-soft': 'rgb(var(--color-border-soft-rgb) / <alpha-value>)',
            'border-strong': 'rgb(var(--color-border-strong-rgb) / <alpha-value>)',
            'saffron': 'rgb(var(--color-saffron-rgb) / <alpha-value>)',
            'saffron-strong': 'rgb(var(--color-saffron-strong-rgb) / <alpha-value>)',
            'saffron-deep': 'rgb(var(--color-saffron-deep-rgb) / <alpha-value>)',
            'saffron-ink': 'rgb(var(--color-saffron-ink-rgb) / <alpha-value>)',
            'terracotta': 'rgb(var(--color-terracotta-rgb) / <alpha-value>)',
            'moss': 'rgb(var(--color-moss-rgb) / <alpha-value>)',
            'tan': 'rgb(var(--color-tan-rgb) / <alpha-value>)',
            'cream': 'rgb(var(--color-cream-rgb) / <alpha-value>)',
            'heading': 'rgb(var(--color-heading-rgb) / <alpha-value>)',
            'muted': 'rgb(var(--color-muted-rgb) / <alpha-value>)',
          },
          fontFamily: {
            display: ['Fraunces', 'Georgia', 'serif'],
            sans: ['Mulish', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Alpine.js Focus + Collapse Plugins & Core CDN — plugins must load before core Alpine itself,
       which is why both plugin scripts sit above the alpinejs@3.x.x line below. Collapse is required
       for the search bar's x-collapse to actually animate (without it, Alpine silently falls back to
       an instant show/hide and logs a console warning). -->
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    [x-cloak] { display: none !important; }

    /* ============ THEME PALETTES (color values only — layout/structure never changes) ============
       Each theme defines the same 16 --color-*-rgb variables as "R G B" space-separated triplets
       (required for the rgb(var(...) / alpha) pattern above). :root is the default (Indian) theme;
       [data-theme="italian"], [data-theme="emirati"], and [data-theme="japanese"] override the same
       variables when that attribute is set on <body> by the cuisine switcher. All four were verified
       to clear WCAG AA (4.5:1+) for every text token against every surface — including the primary
       button's gradient stops — and all four give surface-raised a real lightness step above
       surface/ink so cards and modals visibly lift off the page. */
    :root {
      /* INDIAN — Saffron, Indigo & Antique Gold */
      --color-ink-rgb: 14 15 28;
      --color-surface-rgb: 23 26 43;
      --color-surface-raised-rgb: 40 46 72;
      --color-surface-sunken-rgb: 10 10 20;
      --color-border-soft-rgb: 58 58 90;
      --color-border-strong-rgb: 74 74 112;
      --color-saffron-rgb: 226 171 72;
      --color-saffron-strong-rgb: 240 185 77;
      --color-saffron-deep-rgb: 217 119 50;
      --color-saffron-ink-rgb: 26 16 0;
      --color-terracotta-rgb: 232 145 122;
      --color-moss-rgb: 156 173 82;
      --color-tan-rgb: 203 191 166;
      --color-cream-rgb: 242 232 213;
      --color-heading-rgb: 251 246 234;
      --color-muted-rgb: 176 165 148;
    }

    [data-theme="italian"] {
      /* ITALIAN — Oxblood, Brick & Gold
         Replaces the original terracotta/espresso palette: your Emirati teal was the strongest of
         the original three, and the original Italian and Japanese were sitting too close in hue and
         value to read as distinct at a glance. This one is built from your reference swatches (the
         black/oxblood/brick/gold row) — a moodier "wine cellar" palette that also gives Italian a
         clearer identity next to Emirati's teal and Japanese's neutral charcoal below. */
      --color-ink-rgb: 16 8 9;
      --color-surface-rgb: 30 14 14;
      --color-surface-raised-rgb: 52 26 24;
      --color-surface-sunken-rgb: 10 5 5;
      --color-border-soft-rgb: 70 40 36;
      --color-border-strong-rgb: 90 54 48;
      --color-saffron-rgb: 224 158 54;
      --color-saffron-strong-rgb: 251 183 38;
      --color-saffron-deep-rgb: 226 76 35;
      --color-saffron-ink-rgb: 28 12 4;
      --color-terracotta-rgb: 226 108 73;
      --color-moss-rgb: 140 168 148;
      --color-tan-rgb: 200 180 168;
      --color-cream-rgb: 230 220 208;
      --color-heading-rgb: 245 238 228;
      --color-muted-rgb: 168 152 144;
    }

    [data-theme="emirati"] {
      /* EMIRATI — Gulf Teal, Desert Sand & Copper */
      --color-ink-rgb: 8 26 27;
      --color-surface-rgb: 16 44 44;
      --color-surface-raised-rgb: 30 70 68;
      --color-surface-sunken-rgb: 5 16 15;
      --color-border-soft-rgb: 46 82 80;
      --color-border-strong-rgb: 62 102 99;
      --color-saffron-rgb: 211 160 100;
      --color-saffron-strong-rgb: 224 178 120;
      --color-saffron-deep-rgb: 185 120 69;
      --color-saffron-ink-rgb: 35 20 4;
      --color-terracotta-rgb: 230 155 108;
      --color-moss-rgb: 162 190 151;
      --color-tan-rgb: 216 199 168;
      --color-cream-rgb: 242 230 207;
      --color-heading-rgb: 250 243 227;
      --color-muted-rgb: 180 174 151;
    }

    [data-theme="japanese"] {
      /* JAPANESE — Charcoal, Slate & Amber
         Replaces the original vermillion palette, which read too close to Italian's terracotta at
         a glance. Built from your second reference swatch row (#0A0A0C / #1E1F25 / #3B3F4A / #FFB000
         / #F2F5F8) — a true neutral charcoal-and-slate base (no warm or blue undertone at all) with
         a single punchy amber accent, which reads as the most "minimalist modern" of the four and
         sits clearly apart from Italian's oxblood and Emirati's teal. */
      --color-ink-rgb: 8 8 10;
      --color-surface-rgb: 18 18 21;
      --color-surface-raised-rgb: 32 33 39;
      --color-surface-sunken-rgb: 5 5 6;
      --color-border-soft-rgb: 59 63 74;
      --color-border-strong-rgb: 78 84 98;
      --color-saffron-rgb: 224 152 10;
      --color-saffron-strong-rgb: 255 176 3;
      --color-saffron-deep-rgb: 196 132 0;
      --color-saffron-ink-rgb: 26 16 0;
      --color-terracotta-rgb: 210 126 84;
      --color-moss-rgb: 150 172 140;
      --color-tan-rgb: 188 182 170;
      --color-cream-rgb: 222 224 228;
      --color-heading-rgb: 242 245 248;
      --color-muted-rgb: 164 166 174;
    }

    /* Every hardcoded hex duplicate below was a real bug once before in this file's history (the
       body background silently ignoring the Tailwind token). This time every one of them reads
       from the same CSS variables as the Tailwind config, so a theme switch reskins the whole page
       including these — nothing can drift out of sync with the active theme again. */
    body {
      background-color: rgb(var(--color-ink-rgb));
      background-image: radial-gradient(ellipse 1200px 800px at 50% -10%, rgb(var(--color-terracotta-rgb) / 0.05), transparent 60%);
      color: rgb(var(--color-cream-rgb));
      font-family: 'Mulish', ui-sans-serif, system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h1, h2, h3, h4, .font-display {
      font-family: 'Fraunces', Georgia, serif;
    }

    .tabular {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
    }

    /* ============ ARABIC / RTL SUPPORT ============
       Applied only via the .font-arabic class, which is bound to <body> only when isArabic is true
       (see :class binding on <body> below) — so English/IN/IT/JP rendering is completely untouched.
       Noto Kufi Arabic replaces both the display (Fraunces) and body (Mulish) fonts everywhere at
       once, since Arabic needs one consistent typeface rather than a serif/sans pairing designed
       for Latin script. dir="rtl" (bound on <html> via a tiny x-effect, since Alpine state lives on
       <body>) handles the actual right-to-left flow/mirroring for free on block and flex layouts —
       these two rules just make the *typography* match. tabular/.tabular numbers intentionally stay
       LTR even in Arabic mode (below) since prices/quantities read the same direction either way. */
    .font-arabic, .font-arabic h1, .font-arabic h2, .font-arabic h3, .font-arabic h4, .font-arabic .font-display {
      font-family: 'Noto Kufi Arabic', 'Mulish', ui-sans-serif, system-ui, sans-serif;
    }
    .font-arabic .tabular {
      direction: ltr;
      unicode-bidi: isolate;
      display: inline-block;
    }

    ::selection { background: rgb(var(--color-saffron-rgb)); color: rgb(var(--color-saffron-ink-rgb)); }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .touch-target { min-width: 44px; min-height: 44px; }

    .glass-nav {
      background: rgb(var(--color-surface-rgb) / 0.90);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background-color 0.3s ease;
    }

    /* ============ GLOSSY SURFACE TREATMENT ============
       A flat background-color reads as dull/dry no matter how good the hue is. These give cards,
       the modal, and the primary button a real top-lit sheen: a subtle gradient (lighter at the
       top edge, settling to the base tone) plus a thin inset highlight line simulating a soft
       light catching the top edge — the two things that actually read as "glossy" to the eye. */
    .gloss-surface {
      background-image: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 14%);
      background-color: rgb(var(--color-surface-rgb));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 6px 18px rgba(0,0,0,0.35);
      transition: background-color 0.3s ease;
    }
    .gloss-raised {
      background-image: linear-gradient(180deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0) 18%);
      background-color: rgb(var(--color-surface-raised-rgb));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 10px 26px rgba(0,0,0,0.4);
      transition: background-color 0.3s ease;
    }
    .gloss-saffron {
      background-image: linear-gradient(180deg, rgb(var(--color-saffron-strong-rgb)) 0%, rgb(var(--color-saffron-rgb)) 55%, rgb(var(--color-saffron-deep-rgb)) 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 4px 14px rgb(var(--color-saffron-rgb) / 0.30);
    }

    /* Forces real color-emoji rendering (the chili shows in its native red) no matter what text
       color a parent button/element sets. Without this, some browsers can render emoji using a
       flat/monochrome glyph that picks up the inherited text color instead of true emoji color. */
    .emoji-glyph {
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Segoe UI Symbol", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Image slot placeholder — reads as "photo pending", not permanent decoration */
    .photo-slot {
      background: linear-gradient(135deg, rgb(var(--color-surface-raised-rgb)) 0%, rgb(var(--color-ink-rgb)) 100%);
      position: relative;
    }
    .photo-slot::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(90deg, rgb(var(--color-tan-rgb) / 0.05) 1px, transparent 1px),
        linear-gradient(rgb(var(--color-tan-rgb) / 0.05) 1px, transparent 1px);
      background-size: 14px 14px;
    }
    .photo-slot .photo-slot-mark {
      position: relative;
      z-index: 1;
      color: rgb(var(--color-tan-rgb) / 0.32);
    }

    :focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgb(var(--color-terracotta-rgb) / 0.4);
      border-radius: 6px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>

<body x-data="menuApp()" x-init="initApp()" :data-theme="currentCuisine"
      class="min-h-screen pb-28 antialiased selection:bg-saffron selection:text-saffron-ink">

  <!-- ==================== HEADER & NAVBAR ==================== -->
  <header class="sticky top-0 z-30 glass-nav border-b border-border-soft">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between gap-4">

      <!-- Brand Logo / Name -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-saffron/15 border border-saffron/40 flex items-center justify-center shrink-0">
          <svg class="w-5 h-5 text-saffron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 21a9 9 0 100-18 9 9 0 000 18zM12 8v4l3 3"></path>
          </svg>
        </div>
        <!-- Header (logo, tagline, cuisine pills, search bar) intentionally stays English/LTR
             always, regardless of the language toggle — this is the restaurant's own brand row.
             For a real single-restaurant deployment this becomes their actual logo/name, which
             shouldn't flip language when a diner switches the menu to Arabic; only the content
             below it (hero banner downward) responds to isArabic.

             The tagline is the BITEit PLATFORM's own tagline (this demo app itself), not a
             per-cuisine restaurant tagline — it's here only for this multi-cuisine sales demo and
             disappears completely once a real client's own logo/branding replaces this header. So
             it's a fixed string, not read from cuisineData, and must never change when switching
             the demo between Indian/Italian/Emirati/Japanese. -->
        <div>
          <h1 class="font-display font-semibold text-lg sm:text-xl lg:text-3xl tracking-wide text-heading leading-tight" x-text="restaurant.name">BITEit</h1>
          <p class="text-xs text-muted flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-moss inline-block animate-pulse"></span>
            <span>Browse. Choose. Savor.</span>
          </p>
        </div>
      </div>

      <!-- Action Utilities -->
      <div class="flex items-center gap-2">
        <button
          @click="searchOpen = !searchOpen; $nextTick(() => measureHeader())"
          class="touch-target p-2.5 rounded-lg bg-surface border border-border-soft text-cream hover:border-saffron/50 transition-colors flex items-center justify-center"
          aria-label="Toggle Search">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- ==================== CUISINE SWITCHER ====================
         Demo-mode control: this single app carries four full menus + four color themes so it can be
         shown to an Indian, Italian, Emirati, or Japanese restaurant prospect from the same build.
         Picking a cuisine here swaps both the color palette (via the data-theme attribute on <body>,
         set two lines above) and the entire menu content (categories, dishes, add-ons) together —
         see switchCuisine() in the state engine below. This strip is cosmetic/demo scaffolding only;
         a real single-restaurant deployment would remove it and hardcode one cuisine.

         Wrapped in the same max-w-7xl/mx-auto/px-4 sm:px-6 lg:px-8 column as the header row above and
         <main> below, so the pills line up with the logo, the hero card, and the dish grid at every
         screen width instead of drifting to a bare 16px from the browser edge on desktop. -->
    <div class="border-t border-border-soft">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2.5 flex items-center gap-2 overflow-x-auto no-scrollbar">
        <span class="text-[10px] font-black text-muted uppercase tracking-wider shrink-0 hidden sm:inline">Cuisines:</span>
        <!-- Cuisine pills shrink slightly (px-3→px-2, gap-1→gap-0.5, smaller flag/emoji text) below
             the lg breakpoint only when Emirati+its language toggle needs the room — see the toggle
             button just after this template block, which only ever renders on the Emirati skin. -->
        <template x-for="c in cuisineList" :key="c.id">
          <button
            @click="switchCuisine(c.id)"
            :class="[currentCuisine === c.id ? 'bg-saffron text-saffron-ink font-black border-saffron' : 'bg-surface text-tan border-border-soft hover:text-cream hover:border-border-strong', currentCuisine === 'emirati' ? 'px-2 sm:px-3 gap-0.5 sm:gap-1 text-sm sm:text-base' : 'px-3 gap-1 text-base']"
            :aria-label="c.label + ' cuisine'"
            :aria-pressed="currentCuisine === c.id"
            class="touch-target py-1.5 rounded-full border whitespace-nowrap transition-all duration-150 shrink-0 flex items-center font-bold emoji-glyph">
            <span x-text="c.flag"></span>
            <span x-text="c.emoji"></span>
          </button>
        </template>

        <!-- ==================== EN/AR LANGUAGE TOGGLE (Emirati skin only, mobile/tablet position) ====================
             Only ever renders when currentCuisine === 'emirati' — completely absent from IN/IT/JP,
             so nothing about their layout changes. On lg+ screens this copy is hidden here and shown
             instead inside the hero banner (see below), matching the two positions in the reference
             image: inline with the cuisine pills on narrow screens, inside the hero card on desktop. -->
        <button
          x-show="currentCuisine === 'emirati'"
          x-cloak
          @click="toggleLanguage()"
          type="button"
          role="switch"
          :aria-checked="isArabic"
          aria-label="Toggle English or Arabic"
          class="lg:hidden touch-target shrink-0 ms-1 relative w-[68px] h-8 rounded-full border border-border-soft transition-colors duration-200 flex items-center px-1"
          :class="isArabic ? 'bg-moss/20' : 'bg-surface'">
          <span class="absolute left-2 text-[9px] font-black tracking-wide transition-opacity" :class="isArabic ? 'opacity-40 text-muted' : 'opacity-0'">AR</span>
          <span class="absolute right-2 text-[9px] font-black tracking-wide transition-opacity" :class="!isArabic ? 'opacity-40 text-muted' : 'opacity-0'">EN</span>
          <span
            class="w-6 h-6 rounded-full bg-cream shadow-md flex items-center justify-center overflow-hidden border border-border-soft transition-transform duration-200 shrink-0"
            :class="isArabic ? 'translate-x-[34px]' : 'translate-x-0'">
            <!-- UK flag (English) -->
            <svg x-show="!isArabic" viewBox="0 0 60 36" class="w-full h-full">
              <rect width="60" height="36" fill="#012169"/>
              <path d="M0 0L60 36M60 0L0 36" stroke="#FFF" stroke-width="6"/>
              <path d="M0 0L60 36M60 0L0 36" stroke="#C8102E" stroke-width="2"/>
              <path d="M30 0V36M0 18H60" stroke="#FFF" stroke-width="10"/>
              <path d="M30 0V36M0 18H60" stroke="#C8102E" stroke-width="6"/>
            </svg>
            <!-- UAE flag (Arabic) -->
            <svg x-show="isArabic" viewBox="0 0 60 36" class="w-full h-full">
              <rect width="20" height="36" fill="#EF3340"/>
              <rect x="20" width="40" height="12" fill="#00732F"/>
              <rect x="20" y="12" width="40" height="12" fill="#FFFFFF"/>
              <rect x="20" y="24" width="40" height="12" fill="#000000"/>
            </svg>
          </span>
        </button>
      </div>
    </div>

    <!-- Expandable Search Bar -->
    <div x-show="searchOpen" x-collapse x-cloak class="border-t border-border-soft bg-surface/95 px-4 py-3">
      <div class="max-w-md mx-auto relative">
        <!-- Placeholder intentionally stays the English string always (not t()) — the search bar
             lives in the header block, which per the header-stays-fixed rule above never changes
             with the language toggle. -->
        <input
          type="text"
          x-model="searchQuery"
          placeholder="Search dishes, ingredients, or tags (e.g. Biryani, Vegan)..."
          class="w-full bg-surface-sunken text-cream text-sm rounded-lg ps-10 pe-10 py-3 border border-border-soft focus:border-saffron focus:outline-none focus:ring-1 focus:ring-saffron placeholder:text-muted"
        >
        <svg class="w-5 h-5 text-muted absolute start-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <button x-show="searchQuery" @click="searchQuery = ''" class="absolute end-3 top-3.5 text-muted hover:text-cream">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- dir/lang + .font-arabic are applied HERE (main) rather than on <html>/<body>, and repeated
       on the sticky cart bar, modal, and drawer below — deliberately scoped below the header so the
       header (logo, tagline, cuisine pills, search) always stays English/LTR regardless of isArabic,
       per the client's requirement that the brand row never flips language. -->
  <main :dir="isArabic ? 'rtl' : 'ltr'" :lang="isArabic ? 'ar' : 'en'" :class="isArabic ? 'font-arabic' : ''" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-4">

    <!-- ==================== HERO BANNER ==================== -->
    <div class="relative rounded-xl overflow-hidden border border-border-soft bg-gradient-to-r from-surface to-surface-raised p-6 mb-6">
      <!-- Reserves space on whichever side the toggle currently sits — right in English, left in
           Arabic (matches the toggle's own left-6/right-6 flip above) — so the heading text never
           runs under it either way. -->
      <div class="relative z-10 max-w-2xl" :class="currentCuisine === 'emirati' ? (isArabic ? 'lg:pl-28' : 'lg:pr-28') : ''">
        <!-- Tagline pill removed here — "Browse. Choose. Savor." already appears once under the
             BITEit logo in the header, and that logo+tagline pairing is what becomes the final
             restaurant's actual logo graphic, so it shouldn't be repeated a second time on the page. -->
        <h2 class="font-display font-semibold text-2xl sm:text-3xl text-heading leading-tight mb-2" style="text-wrap: balance;" x-text="isArabic ? (cuisineData.emirati.heroHeadingAr || cuisineData.emirati.heroHeading) : cuisineData[currentCuisine].heroHeading">
          Flavours of the Middle East
        </h2>
        <!-- Font size bumped up from Tailwind's text-xs/text-sm presets (0.75rem / 0.875rem) per
             hands-on testing in devtools: 0.9rem reads right on mobile, 1rem on tablet+. Using an
             inline text-[size] utility instead of the default classes so these exact tested values
             are what ships, not the closest Tailwind preset. -->
        <p class="text-[0.9rem] sm:text-[1rem] lg:text-[1.05rem] text-muted" x-text="isArabic ? (cuisineData.emirati.heroSubtextAr || cuisineData.emirati.heroSubtext) : cuisineData[currentCuisine].heroSubtext">
          A vibrant celebration of Emirati, Syrian, Lebanese, and Turkish cuisine, from mezze and grills to breads, rice dishes, and sweets.
        </p>
      </div>

      <!-- ==================== EN/AR LANGUAGE TOGGLE (Emirati skin only, desktop position) ====================
           Mirrors the mobile/tablet toggle above (same toggleLanguage()/isArabic state) but positioned
           top-right inside the hero card per the reference image, visible from lg breakpoint up only —
           the pill-row version above handles every screen narrower than that. -->
      <button
        x-show="currentCuisine === 'emirati'"
        x-cloak
        @click="toggleLanguage()"
        type="button"
        role="switch"
        :aria-checked="isArabic"
        aria-label="Toggle English or Arabic"
        dir="ltr"
        :class="isArabic ? 'left-6' : 'right-6'"
        class="hidden lg:flex absolute top-5 z-20 items-center gap-1.5 shrink-0">
        <!-- dir="ltr" is pinned on the button's OWN internal layout only — so the EN label, the
             sliding circle, and the AR label never mirror themselves (that was a separate bug: the
             circle's slide math broke when its own flex row flipped). That is NOT the same as the
             button's position on the page: the button itself still moves from top-right (English)
             to top-left (Arabic) via the :class above, matching the reversed text below it. -->
        <span class="text-[11px] font-black tracking-wide transition-opacity" :class="!isArabic ? 'text-cream' : 'text-muted opacity-50'">EN</span>
        <span
          class="relative w-[60px] h-7 rounded-full border border-border-soft transition-colors duration-200 flex items-center px-1"
          :class="isArabic ? 'bg-moss/20' : 'bg-surface'">
          <span
            class="w-5 h-5 rounded-full bg-cream shadow-md flex items-center justify-center overflow-hidden border border-border-soft transition-transform duration-200 shrink-0"
            :class="isArabic ? 'translate-x-[30px]' : 'translate-x-0'">
            <svg x-show="!isArabic" viewBox="0 0 60 36" class="w-full h-full">
              <rect width="60" height="36" fill="#012169"/>
              <path d="M0 0L60 36M60 0L0 36" stroke="#FFF" stroke-width="6"/>
              <path d="M0 0L60 36M60 0L0 36" stroke="#C8102E" stroke-width="2"/>
              <path d="M30 0V36M0 18H60" stroke="#FFF" stroke-width="10"/>
              <path d="M30 0V36M0 18H60" stroke="#C8102E" stroke-width="6"/>
            </svg>
            <svg x-show="isArabic" viewBox="0 0 60 36" class="w-full h-full">
              <rect width="20" height="36" fill="#EF3340"/>
              <rect x="20" width="40" height="12" fill="#00732F"/>
              <rect x="20" y="12" width="40" height="12" fill="#FFFFFF"/>
              <rect x="20" y="24" width="40" height="12" fill="#000000"/>
            </svg>
          </span>
        </span>
        <span class="text-[11px] font-black tracking-wide transition-opacity" :class="isArabic ? 'text-cream' : 'text-muted opacity-50'">AR</span>
      </button>
    </div>

    <!-- ==================== CATEGORY PICKER SCREEN (photo cards) ====================
         Shown first, every time the cuisine changes (see switchCuisine()) — a big-photo entry
         screen using this cuisine's own 6 real category photos, so the customer picks a category
         visually before ever seeing the normal compact menu view. One tap (enterCategory() below)
         sets the filter and switches categoryScreenActive off, revealing the exact same text-tabs
         + dish-grid view the app always had — nothing about that view changed. "All Items" is
         included as a 7th tile so someone can skip straight to browsing everything. -->
    <div x-show="categoryScreenActive" x-cloak class="mb-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="cat in displayCategories" :key="cat.id">
          <button
            @click="enterCategory(cat.id)"
            type="button"
            class="relative rounded-xl overflow-hidden border border-border-soft aspect-[4/3] group focus-visible:outline-none">
            <img :src="cat.image" :alt="cat.name" loading="lazy" class="absolute inset-0 w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-ink/80 via-ink/15 to-transparent"></div>
            <span class="absolute bottom-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-md bg-ink/70 border border-cream/20 text-heading font-display font-semibold text-base sm:text-lg tracking-wide uppercase whitespace-nowrap group-hover:border-saffron/60 transition-colors" x-text="cat.name"></span>
          </button>
        </template>

        <!-- Moved to last position per instruction: 6 category photos fill the viewport cleanly,
             with "All Items" as the 7th tile at the end for anyone who wants to skip filtering. -->
        <button
          @click="enterCategory('all')"
          type="button"
          class="relative rounded-xl overflow-hidden border border-border-soft aspect-[4/3] group focus-visible:outline-none">
          <div class="absolute inset-0 bg-gradient-to-br from-surface to-surface-raised flex items-center justify-center">
            <svg class="w-14 h-14 text-tan/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </div>
          <div class="absolute inset-0 bg-gradient-to-t from-ink/70 via-ink/10 to-transparent"></div>
          <span class="absolute bottom-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-md bg-ink/70 border border-cream/20 text-heading font-display font-semibold text-base sm:text-lg tracking-wide uppercase group-hover:border-saffron/60 transition-colors" x-text="t('allItems')"></span>
        </button>
      </div>
    </div>

    <!-- ==================== CATEGORY FILTER TABS + DISH GRID (normal menu view) ====================
         Unchanged from before — same tabs, same dish cards, same empty state. Only difference: this
         whole block is now hidden while categoryScreenActive is true (the photo-card screen above
         is showing instead). enterCategory() is what flips categoryScreenActive off and lands here
         with the tapped category already selected. -->
    <div x-show="!categoryScreenActive">

    <!-- ==================== CATEGORY FILTER TABS ====================
         Previously used a negative-margin "full-bleed" trick so this bar's translucent background
         extended past <main>'s padding while scrolling. Removed: the bleeding backdrop was exactly
         what read as "wider than the hero card and dish grid" even once the buttons inside it lined
         up correctly. Now this sits as a plain block inside <main>, so its background — not just its
         content — matches the hero card and dish grid edge-for-edge at every screen width. -->
    <div :style="'top: ' + headerHeight + 'px'" class="sticky z-20 glass-nav py-3 mb-6 border-b border-border-soft overflow-x-auto no-scrollbar flex items-center gap-2">
      <button
        @click="activeCategory = 'all'"
        :class="activeCategory === 'all' ? 'bg-saffron text-saffron-ink font-extrabold border-saffron' : 'bg-surface text-tan border-border-soft hover:text-cream hover:border-border-strong'"
        class="touch-target px-5 py-2.5 rounded-lg border text-sm whitespace-nowrap transition-all duration-150 shrink-0 flex items-center justify-center font-bold"
        x-text="t('allItems')">
      </button>

      <template x-for="cat in displayCategories" :key="cat.id">
        <button
          @click="activeCategory = cat.id"
          :class="activeCategory === cat.id ? 'bg-saffron text-saffron-ink font-extrabold border-saffron' : 'bg-surface text-tan border-border-soft hover:text-cream hover:border-border-strong'"
          class="touch-target px-5 py-2.5 rounded-lg border text-sm whitespace-nowrap transition-all duration-150 shrink-0 flex items-center justify-center font-bold">
          <span x-text="cat.name"></span>
        </button>
      </template>
    </div>

    <!-- ==================== DISH CARDS GRID ==================== -->
    <div x-show="!isLoading" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
      <template x-for="dish in displayDishes" :key="dish.id">
        <div class="gloss-surface rounded-xl border border-border-soft hover:border-saffron/40 transition-all duration-200 p-3 flex flex-col group relative overflow-hidden">

          <!-- Photo Slot (4:3 — built for real food photography; badge + price overlay positions are permanent) -->
          <div class="photo-slot w-full aspect-[4/3] rounded-lg overflow-hidden mb-3 border border-border-soft/50">
            <span
              x-show="dish.badge"
              class="absolute top-2 left-2 px-2 py-0.5 rounded-md text-[10px] font-black tracking-wide uppercase z-10 border"
              :class="{
                'bg-ink/85 text-saffron-strong border-saffron/40': dish.badge === 'Chef Special' || dish.badge === 'Signature' || dish.badge === 'Must Try' || dish.badge === 'Fusion',
                'bg-ink/85 text-moss border-moss/40': dish.badge === 'Popular' || dish.badge === 'Fresh',
                'bg-ink/85 text-terracotta border-terracotta/40': dish.badge === 'Premium' || dish.badge === 'Spicy'
              }"
              x-text="dish.badge">
            </span>

            <div class="photo-slot-mark absolute inset-0 flex items-center justify-center opacity-40">
              <svg width="120" height="105" viewBox="0 0 216 189" fill="none" xmlns="http://www.w3.org/2000/svg">

 14.9738C92.4006 16.2471 77.2275 22.2422 64.9725 32.0568C62.9566 33.6483 60.9936 35.3459 60.5692 35.8234C59.7203 36.9375 58.3944 36.9906 58.3944 35.9826C58.395 34.9212 63.8057 30.1996 69.2166 26.5392C79.2965 19.8016 88.634 16.088 101.632 13.6476Z" fill="currentColor"/>
              </svg>
            </div>

            <div class="absolute bottom-2 right-2 bg-ink/85 border border-border-soft text-saffron-strong font-bold text-xs px-2.5 py-1 rounded-lg tabular z-10">
              AED <span x-text="dish.price.toFixed(2)"></span>
            </div>

            <!-- Dietary Tag Badge -->
            <span
              x-show="dish.isVeg"
              class="absolute top-2 right-2 px-1.5 py-0.5 rounded bg-moss/15 border border-moss/40 text-[10px] font-black text-moss z-10"
              x-text="t('veg')">
            </span>
            <span
              x-show="!dish.isVeg"
              class="absolute top-2 right-2 px-1.5 py-0.5 rounded bg-terracotta/15 border border-terracotta/40 text-[10px] font-black text-terracotta z-10"
              x-text="t('nonVeg')">
            </span>
          </div>

          <!-- Dish Details Content -->
          <div class="flex-1 flex flex-col justify-between min-w-0">
            <div>
              <h3 class="font-display font-medium text-heading text-base leading-snug mb-1" x-text="dish.name"></h3>
              <p class="text-xs text-muted line-clamp-2 mb-2 leading-relaxed" x-text="dish.description"></p>

              <!-- Dietary & Chef Tags (excludes whatever's already shown as the badge above, so nothing repeats) -->
              <div class="flex flex-wrap gap-1 mb-3">
                <template x-for="tag in dish.tags.filter(t => t !== dish.badge)" :key="tag">
                  <span class="text-[10px] px-2 py-0.5 rounded-md bg-surface-sunken text-tan border border-border-soft/60 font-semibold" x-text="tag"></span>
                </template>
              </div>
            </div>

            <!-- Add Trigger Action -->
            <button
              @click="openOptionModal(dish)"
              class="touch-target w-full py-2.5 rounded-lg bg-transparent hover:bg-saffron/10 text-cream border border-border-strong hover:border-saffron font-bold text-[11px] uppercase tracking-wide transition-colors flex items-center justify-center gap-1.5">
              <span x-text="t('addToTray')"></span>
            </button>
          </div>

        </div>
      </template>
    </div>

    <!-- Empty State -->
    <div x-show="!isLoading && filteredDishes.length === 0" class="text-center py-16 px-4">
      <h3 class="font-display font-medium text-lg text-heading mb-1" x-text="t('noResultsTitle')"></h3>
      <p class="text-xs text-muted mb-4" x-text="t('noResultsBody')"></p>
      <button
        @click="searchQuery = ''; activeCategory = 'all'"
        class="px-4 py-2 rounded-lg bg-saffron text-saffron-ink font-extrabold text-[11px] uppercase tracking-wide"
        x-text="t('resetFilters')">
      </button>
    </div>

    </div>
    <!-- end normal menu view (tabs + dish grid) -->

  </main>

  <!-- ==================== MODAL: CUSTOMIZATION ==================== -->
  <div
    x-show="modalOpen"
    x-trap.noscroll="modalOpen"
    x-cloak
    :dir="isArabic ? 'rtl' : 'ltr'"
    :class="isArabic ? 'font-arabic' : ''"
    class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-ink/85 backdrop-blur-sm"
    x-transition.opacity>

    <div
      @click.outside="modalOpen = false"
      class="w-full sm:max-w-lg gloss-raised border border-border-soft rounded-t-2xl sm:rounded-xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">

      <!-- Modal Header -->
      <div class="p-4 border-b border-border-soft flex items-center justify-between bg-ink/40">
        <div>
          <h3 class="font-display font-medium text-lg text-heading" x-text="selectedDish?.name"></h3>
          <p class="text-xs text-saffron-strong font-bold tabular mt-0.5">AED <span x-text="selectedDish?.price.toFixed(2)"></span></p>
        </div>
        <button @click="modalOpen = false" class="touch-target p-2 text-muted hover:text-cream flex items-center justify-center">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="p-4 overflow-y-auto space-y-5 flex-1">

        <!-- Portion Selection -->
        <div>
          <label class="flex items-center gap-1.5 text-[11px] font-black text-saffron-strong uppercase tracking-wider mb-2.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2a5 5 0 00-5 5v2a5 5 0 0010 0V7a5 5 0 00-5-5zM7 13v3a5 5 0 0010 0v-3"/></svg>
            <span x-text="t('selectPortion')"></span>
          </label>
          <div class="space-y-2">
            <template x-for="portion in portionsList" :key="portion.name">
              <label @click="selectedOptions.portion = portion.name"
                     :class="selectedOptions.portion === portion.name
                       ? 'border-saffron bg-saffron/10 text-cream font-bold'
                       : 'border-transparent bg-surface text-tan hover:bg-surface-sunken'"
                     class="flex items-center justify-between p-3 rounded-lg border cursor-pointer transition-colors">
                <div class="flex items-center gap-2.5">
                  <div class="w-4 h-4 rounded-full border flex items-center justify-center transition-colors"
                       :class="selectedOptions.portion === portion.name ? 'border-saffron bg-saffron' : 'border-tan/40'">
                    <div x-show="selectedOptions.portion === portion.name" class="w-1.5 h-1.5 rounded-full bg-saffron-ink"></div>
                  </div>
                  <span class="text-sm" x-text="portion.name"></span>
                </div>
                <span class="text-[11px] text-muted font-semibold tabular" x-text="portion.tag"></span>
              </label>
            </template>
          </div>
        </div>

        <!-- Spice Level -->
        <div>
          <label class="block text-xs font-black text-saffron-strong uppercase tracking-wider mb-2" x-text="t('spiceLevel')"></label>
          <div class="grid grid-cols-3 gap-2">
            <template x-for="spice in spiceLevels" :key="spice.name">
              <button
                type="button"
                @click="selectedOptions.spice = spice.name"
                :class="selectedOptions.spice === spice.name ? 'bg-saffron/20 text-saffron-strong font-black border-saffron' : 'bg-surface text-tan border-transparent hover:bg-surface-sunken'"
                class="touch-target py-2 px-2 text-xs rounded-lg border transition-colors flex flex-col items-center justify-center gap-1 text-center">
                <!-- Real 🌶 emoji glyph. Round 1 tried style="color: initial" — that was wrong: CSS
                     "initial" resolves to the property's spec default (black), not "no color", so it
                     didn't fix anything. The actual cause: color emoji fonts can render a flat/mono
                     fallback glyph when the browser applies the inherited text `color` to them, which
                     is what happened when this span sat inside a button colored near-black. Fix: force
                     the OS/browser's native color-emoji font stack directly (so it can never fall back
                     to a text glyph) and leave color completely unset — Gemini's version works for the
                     same reason, its emoji sits in plain unstyled text with no color touching it. -->
                <span class="emoji-glyph text-sm leading-none" x-text="spice.icon"></span>
                <span x-text="spice.name"></span>
              </button>
            </template>
          </div>
        </div>

        <!-- Add-on Extras -->
        <div>
          <label class="flex items-center gap-1.5 text-xs font-black text-saffron-strong uppercase tracking-wider mb-2">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            <span x-text="t('addonsExtras')"></span>
          </label>
          <div class="space-y-2">
            <template x-for="addon in displayAddons" :key="addon.id">
              <label class="flex items-center justify-between p-3 rounded-lg bg-surface border border-transparent cursor-pointer hover:bg-surface-sunken transition-colors">
                <div class="flex items-center gap-3">
                  <input
                    type="checkbox"
                    :value="addon.id"
                    x-model="selectedOptions.addons"
                    class="w-4 h-4 rounded border-tan/40 text-saffron focus:ring-saffron bg-surface-sunken">
                  <span class="text-sm text-cream" x-text="addon.name"></span>
                </div>
                <span class="text-xs font-bold text-saffron-strong tabular">+AED <span x-text="addon.price.toFixed(2)"></span></span>
              </label>
            </template>
          </div>
        </div>

        <!-- Special Notes -->
        <div>
          <label class="flex items-center gap-1.5 text-xs font-black text-saffron-strong uppercase tracking-wider mb-2">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.5-9.5a2.121 2.121 0 013 3L12 16l-4 1 1-4 9.5-9.5z"/></svg>
            <span x-text="t('specialInstructions')"></span>
          </label>
          <textarea
            x-model="selectedOptions.notes"
            :placeholder="t('notesPlaceholder')"
            rows="2"
            class="w-full bg-surface-sunken text-cream text-sm rounded-lg p-3 border border-transparent focus:border-saffron focus:outline-none placeholder:text-muted resize-none"></textarea>
        </div>

        <!-- Quantity Selector -->
        <div class="flex items-center justify-between pt-2">
          <span class="text-sm font-bold text-cream" x-text="t('quantity')"></span>
          <div class="flex items-center gap-3 bg-surface border border-transparent rounded-lg p-1">
            <button
              @click="modalQty = Math.max(1, modalQty - 1)"
              class="touch-target w-8 h-8 rounded-lg bg-surface-sunken hover:bg-saffron/15 hover:text-saffron-strong text-cream flex items-center justify-center font-bold text-lg transition-colors">
              -
            </button>
            <span class="w-6 text-center text-sm font-bold text-cream tabular" x-text="modalQty"></span>
            <button
              @click="modalQty++"
              class="touch-target w-8 h-8 rounded-lg bg-surface-sunken hover:bg-saffron/15 hover:text-saffron-strong text-cream flex items-center justify-center font-bold text-lg transition-colors">
              +
            </button>
          </div>
        </div>

      </div>

      <!-- Modal Footer -->
      <div class="p-4 border-t border-border-soft bg-ink/40 flex items-center justify-between gap-4">
        <div>
          <span class="text-xs text-muted block" x-text="t('total')"></span>
          <span class="font-bold text-saffron-strong text-lg tabular">AED <span x-text="calculateModalTotal().toFixed(2)"></span></span>
        </div>
        <button
          @click="confirmAddToCart()"
          class="touch-target flex-1 max-w-xs py-2.5 px-5 rounded-lg gloss-saffron hover:brightness-110 text-saffron-ink font-black text-[12px] uppercase tracking-wide transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
          <span x-text="t('addToOrderTray')"></span>
        </button>
      </div>

    </div>
  </div>

  <!-- ==================== STICKY CART BAR ==================== -->
  <div
    x-show="cart.length > 0"
    x-transition:enter="transition ease-out duration-300 transform"
    x-transition:enter-start="translate-y-full"
    x-transition:enter-end="translate-y-0"
    :dir="isArabic ? 'rtl' : 'ltr'"
    :class="isArabic ? 'font-arabic' : ''"
    class="fixed bottom-0 left-0 right-0 z-40 p-4 glass-nav border-t border-border-soft">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">

      <div class="flex items-center gap-2.5 min-w-0">
        <div class="relative shrink-0">
          <div class="w-11 h-11 rounded-lg gloss-saffron flex items-center justify-center text-saffron-ink font-bold">
            <!-- Cloche/serving-tray icon — food-relevant, replaces the old shopping-bag glyph -->
            <svg class="w-6 h-6" viewBox="0 0 292 270" fill="currentColor" xmlns="http://www.w3.org/2000/svg">

            </svg>
          </div>
          <span class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-terracotta text-cream text-[10px] font-bold flex items-center justify-center border-2 border-ink tabular" x-text="cartTotalCount()"></span>
        </div>
        <div class="min-w-0">
          <span class="text-xs text-muted block whitespace-nowrap" x-text="t('totalAmount')"></span>
          <span class="font-bold text-saffron-strong text-base tabular whitespace-nowrap">AED <span x-text="cartTotalPrice().toFixed(2)"></span></span>
        </div>
      </div>

      <!-- whitespace-nowrap + shrink-0 keep "Review Tray" + arrow on one line even in the tight
           space next to the total-amount block on narrow phones — it was wrapping to two lines
           before because nothing stopped the button's flex row from squeezing under pressure. -->
      <button
        @click="cartDrawerOpen = true"
        class="touch-target shrink-0 px-3.5 py-2.5 rounded-lg gloss-saffron hover:brightness-110 text-saffron-ink font-black text-[11px] uppercase tracking-wide transition-all flex items-center gap-1.5 whitespace-nowrap active:scale-[0.98]">
        <span x-text="t('reviewTray')"></span>
        <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </button>

    </div>
  </div>

  <!-- ==================== DRAWER: CART & CHECKOUT ==================== -->
  <!-- Cart drawer slides in from the trailing edge — right in English, left in Arabic. dir is set
       here directly (not inherited from <html>/<body>, which stay LTR always — see the header-stays-
       fixed note on <main> above) since this drawer's own text/layout still needs to mirror when
       Arabic is active. translate-x values are still explicit below since dir alone never flips
       transform: translateX(). -->
  <div
    x-show="cartDrawerOpen"
    x-trap.noscroll="cartDrawerOpen"
    x-cloak
    :dir="isArabic ? 'rtl' : 'ltr'"
    :class="isArabic ? 'font-arabic justify-start' : 'justify-end'"
    class="fixed inset-0 z-50 flex bg-ink/85 backdrop-blur-sm"
    x-transition.opacity>

    <div
      @click.outside="cartDrawerOpen = false"
      class="w-full max-w-md gloss-surface h-full flex flex-col justify-between shadow-2xl"
      :class="isArabic ? 'border-r border-border-soft' : 'border-l border-border-soft'"
      x-show="cartDrawerOpen"
      x-transition:enter="transform transition ease-in-out duration-300"
      x-transition:enter-start="isArabic ? '-translate-x-full' : 'translate-x-full'"
      x-transition:enter-end="translate-x-0"
      x-transition:leave="transform transition ease-in-out duration-300"
      x-transition:leave-start="translate-x-0"
      x-transition:leave-end="isArabic ? '-translate-x-full' : 'translate-x-full'">

      <div class="p-4 border-b border-border-soft flex items-center justify-between gloss-raised shrink-0">
        <div class="flex items-center gap-2">
          <h3 class="font-display font-medium text-lg text-heading uppercase tracking-wide" x-text="t('yourTray')"></h3>
          <span class="text-xs px-2 py-0.5 rounded-full bg-saffron/15 text-saffron-strong font-bold tabular" x-text="cartItemLabel()"></span>
        </div>
        <button @click="cartDrawerOpen = false" class="touch-target p-2 text-muted hover:text-cream flex items-center justify-center">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="p-4 overflow-y-auto flex-1 space-y-3">

        <!-- Order Type & Table Selector -->
        <div class="gloss-raised p-3 rounded-lg border border-border-soft space-y-2.5">
          <div class="flex items-center justify-between text-[11px] font-black text-muted uppercase tracking-wider">
            <span x-text="t('serviceType')"></span>
            <span class="text-saffron-strong" x-text="{'Dine-In': t('dineIn'), 'Takeaway': t('takeaway'), 'Delivery': t('delivery')}[orderType]"></span>
          </div>

          <div class="grid grid-cols-3 gap-1.5 bg-surface-sunken p-1 rounded-lg border border-border-soft">
            <button @click="orderType = 'Dine-In'"
                    :class="orderType === 'Dine-In' ? 'bg-saffron text-saffron-ink font-black' : 'text-muted hover:text-cream'"
                    class="py-1.5 rounded-md text-[11px] text-center transition-colors font-bold flex flex-col items-center gap-0.5">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>
              <span x-text="t('dineIn')"></span>
            </button>
            <button @click="orderType = 'Takeaway'"
                    :class="orderType === 'Takeaway' ? 'bg-saffron text-saffron-ink font-black' : 'text-muted hover:text-cream'"
                    class="py-1.5 rounded-md text-[11px] text-center transition-colors font-bold flex flex-col items-center gap-0.5">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 8h12l-1 12H7L6 8zM9 8V6a3 3 0 016 0v2"/></svg>
              <span x-text="t('takeaway')"></span>
            </button>
            <button @click="orderType = 'Delivery'"
                    :class="orderType === 'Delivery' ? 'bg-saffron text-saffron-ink font-black' : 'text-muted hover:text-cream'"
                    class="py-1.5 rounded-md text-[11px] text-center transition-colors font-bold flex flex-col items-center gap-0.5">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7h11v8H3zM14 10h4l3 3v2h-7zM6.5 19a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM17.5 19a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/></svg>
              <span x-text="t('delivery')"></span>
            </button>
          </div>

          <div x-show="orderType === 'Dine-In'" class="flex items-center justify-between pt-1 text-xs">
            <span class="text-muted" x-text="t('tableNumber')"></span>
            <input type="text" x-model="tableNumber" class="bg-surface-sunken border border-border-soft rounded-lg px-2.5 py-1 text-xs text-saffron-strong font-bold w-24 text-right focus:outline-none focus:border-saffron tabular">
          </div>

          <!-- Takeaway / Delivery contact details -->
          <div x-show="orderType === 'Takeaway' || orderType === 'Delivery'" class="pt-1 space-y-2 text-xs">
            <div>
              <span class="text-muted block mb-1" x-text="t('yourName')"></span>
              <input type="text" x-model="customerName" :placeholder="t('namePlaceholder')" class="w-full bg-surface-sunken border border-border-soft rounded-lg px-2.5 py-1.5 text-cream placeholder:text-muted focus:outline-none focus:border-saffron">
            </div>
            <div>
              <span class="text-muted block mb-1" x-text="t('phoneNumber')"></span>
              <input type="tel" x-model="customerPhone" :placeholder="t('phonePlaceholder')" class="w-full bg-surface-sunken border border-border-soft rounded-lg px-2.5 py-1.5 text-cream placeholder:text-muted focus:outline-none focus:border-saffron tabular">
            </div>
            <div x-show="orderType === 'Delivery'">
              <span class="text-muted block mb-1" x-text="t('deliveryAddress')"></span>
              <textarea x-model="deliveryAddress" rows="2" :placeholder="t('addressPlaceholder')" class="w-full bg-surface-sunken border border-border-soft rounded-lg px-2.5 py-1.5 text-cream placeholder:text-muted focus:outline-none focus:border-saffron resize-none"></textarea>
            </div>
          </div>
        </div>

        <!-- Empty Cart -->
        <template x-if="cart.length === 0">
          <div class="text-center py-16 px-4">
            <div class="w-16 h-16 gloss-raised text-muted rounded-full flex items-center justify-center mx-auto mb-3 text-2xl border border-border-soft">
              🍲
            </div>
            <p class="text-sm font-bold text-cream" x-text="t('emptyTrayTitle')"></p>
            <p class="text-xs text-muted mt-1" x-text="t('emptyTrayBody')"></p>
          </div>
        </template>

        <!-- Tray Items -->
        <template x-for="(item, index) in cart" :key="index">
          <div class="p-3 rounded-lg gloss-raised border border-border-soft flex flex-col gap-2">
            <div class="flex items-start justify-between gap-2">
              <div>
                <h4 class="font-bold text-sm text-cream" x-text="item.dish.name"></h4>
                <p class="text-xs text-saffron-strong tabular">AED <span x-text="item.itemTotal.toFixed(2)"></span></p>
              </div>
              <button @click="removeFromCart(index)" class="text-[11px] text-terracotta hover:text-terracotta/80 p-1 font-bold uppercase tracking-wide" x-text="t('remove')"></button>
            </div>

            <div class="text-[11px] text-muted bg-surface-sunken/60 p-2 rounded-lg space-y-0.5">
              <p x-show="item.options.portion"><span x-text="t('portionLabel')"></span> <span class="text-cream font-semibold" x-text="item.options.portion"></span></p>
              <p><span x-text="t('spiceLabel')"></span> <span class="text-cream font-semibold" x-text="item.options.spice"></span></p>
              <template x-if="item.options.addonsList.length > 0">
                <p><span x-text="t('extrasLabel')"></span> <span class="text-cream" x-text="item.options.addonsList.join(', ')"></span></p>
              </template>
              <template x-if="item.options.notes">
                <p><span x-text="t('noteLabel')"></span> <span class="italic text-cream" x-text="item.options.notes"></span></p>
              </template>
            </div>

            <div class="flex items-center justify-between pt-1">
              <span class="text-xs text-muted"><span x-text="t('qtyLabel')"></span> <strong class="text-cream tabular" x-text="item.qty"></strong></span>
              <span class="text-xs font-bold text-cream tabular"><span x-text="t('subtotalLabel')"></span> AED <span x-text="(item.itemTotal * item.qty).toFixed(2)"></span></span>
            </div>
          </div>
        </template>

      </div>

      <div x-show="cart.length > 0" class="p-4 border-t border-border-soft gloss-raised space-y-3 shrink-0">
        <div class="space-y-1.5 text-xs">
          <div class="flex justify-between text-muted">
            <span x-text="t('subtotal')"></span>
            <span class="font-semibold text-cream tabular">AED <span x-text="cartTotalPrice().toFixed(2)"></span></span>
          </div>
          <div class="flex justify-between text-muted">
            <span x-text="t('vat')"></span>
            <span class="font-semibold text-cream tabular">AED <span x-text="(cartTotalPrice() * 0.05).toFixed(2)"></span></span>
          </div>
          <div class="flex justify-between font-bold text-base text-cream pt-2 border-t border-border-soft">
            <span x-text="t('grandTotal')"></span>
            <span class="text-saffron-strong tabular">AED <span x-text="(cartTotalPrice() * 1.05).toFixed(2)"></span></span>
          </div>
        </div>

        <button
          @click="sendWhatsAppOrder()"
          class="touch-target w-full py-2.5 px-4 rounded-lg bg-[#25D366] hover:bg-[#1ebe5a] text-ink font-black text-[12px] uppercase tracking-wide transition-colors flex items-center justify-center gap-2 shadow-lg active:scale-[0.98]">
          <svg class="w-5 h-5 shrink-0 fill-current" viewBox="0 0 24 24">
            <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
          </svg>
          <span x-text="t('orderViaWhatsApp')"></span>
        </button>

        <button
          @click="callToOrder()"
          class="touch-target w-full py-2.5 px-4 rounded-lg bg-transparent border border-border-strong hover:border-saffron hover:text-saffron-strong text-cream font-bold text-[12px] uppercase tracking-wide transition-colors flex items-center justify-center gap-2 active:scale-[0.98]">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h2.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.05 11.05 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
          <span x-text="t('callToOrder')"></span>
        </button>
      </div>

    </div>
  </div>

  <!-- ==================== ALPINE.JS STATE ENGINE ==================== -->
  <script>
    function menuApp() {
      return {
        isLoading: false,
        searchOpen: false,
        searchQuery: '',
        activeCategory: 'all',

        // menuData/availableAddons stay as computed getters (not plain properties) so every
        // existing template binding and method below — menuData.categories, menuData.dishes,
        // availableAddons — keeps working untouched; only the source they read from changes
        // when currentCuisine changes.
        get menuData() {
          return this.cuisineData[this.currentCuisine];
        },

        get availableAddons() {
          return this.cuisineData[this.currentCuisine].addons;
        },

        // ==================== ARABIC-AWARE DISPLAY LAYER ====================
        // menuData/availableAddons above stay untouched (raw English data — still what's actually
        // stored on cart items, WhatsApp text keys, etc. via dish.id lookups). These three getters
        // are what the TEMPLATE actually binds to for on-screen text: they return the exact same
        // objects but with name/description/tags/badge swapped to their *Ar counterpart whenever
        // isArabic is true. Per instruction, this is Arabic-ONLY when active — never English shown
        // alongside it — so every getter here fully replaces the field, it doesn't append.
        get displayCategories() {
          if (!this.isArabic) return this.menuData.categories;
          return this.menuData.categories.map(cat => ({ ...cat, name: cat.nameAr || cat.name }));
        },

        get displayDishes() {
          const list = this.isArabic ? this.filteredDishes : this.filteredDishes;
          if (!this.isArabic) return list;
          return list.map(dish => ({
            ...dish,
            name: dish.nameAr || dish.name,
            description: dish.descriptionAr || dish.description,
            tags: dish.tagsAr || dish.tags,
            badge: dish.badgeAr || dish.badge
          }));
        },

        get displayAddons() {
          if (!this.isArabic) return this.availableAddons;
          return this.availableAddons.map(a => ({ ...a, name: a.nameAr || a.name }));
        },

        initApp() {
          // Measure right away, then again after everything's painted (fonts/images can still
          // change header height a frame later), and again on any window resize (rotating an
          // iPad, or resizing a desktop window, changes how the cuisine pills wrap).
          this.measureHeader();
          this.$nextTick(() => this.measureHeader());
          window.addEventListener('resize', () => this.measureHeader());
        },

        // Switching cuisine swaps the entire menu, so an in-progress cart from the previous
        // cuisine can't carry over — a Chicken Machboos and a Chicken Carbonara can't ride in the
        // same WhatsApp order. The cart is cleared silently on switch; this is a deliberate call
        // for this demo app, flagged here for anyone maintaining it later.
        switchCuisine(id) {
          if (this.currentCuisine === id) return;
          this.currentCuisine = id;
          this.activeCategory = 'all';
          this.searchQuery = '';
          this.searchOpen = false;
          this.cart = [];
          // Show the photo-card category picker again — this new cuisine has its own 6 categories
          // the customer hasn't picked from yet, so start them at the picker screen, not straight
          // into "All Items".
          this.categoryScreenActive = true;
          // Leaving Emirati always resets language back to English — the toggle button itself is
          // hidden on IN/IT/JP, but this guarantees isArabic can never be silently true if the user
          // switches back to Emirati later expecting to see English first.
          if (id !== 'emirati') this.language = 'en';
          // Switching cuisine can change the header's height (the Emirati pills row is the only
          // one with the language-toggle button squeezed into it), so re-measure once the new
          // row has actually painted.
          this.$nextTick(() => this.measureHeader());
        },

        // Called when a customer taps a category photo card (or the "All Items" tile) on the
        // picker screen. Sets the filter exactly like clicking a text tab always has, then
        // switches away from the photo-card screen to reveal the normal tabs + dish grid.
        enterCategory(categoryId) {
          this.activeCategory = categoryId;
          this.categoryScreenActive = false;
          this.$nextTick(() => this.measureHeader());
        },

        get filteredDishes() {
          return this.menuData.dishes.filter(dish => {
            const matchesCategory = this.activeCategory === 'all' || dish.category === this.activeCategory;
            const matchesSearch = this.searchQuery === '' ||
              dish.name.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
              dish.description.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
              dish.tags.some(t => t.toLowerCase().includes(this.searchQuery.toLowerCase()));
            return matchesCategory && matchesSearch;
          });
        },

        openOptionModal(dish) {
          this.selectedDish = dish;
          this.modalQty = 1;
          this.selectedOptions = { portion: this.t('regularPortion'), spice: this.t('spiceMedium'), addons: [], notes: '' };
          this.modalOpen = true;
        },

        calculateModalTotal() {
          if (!this.selectedDish) return 0;
          let base = this.selectedDish.price;

          const portion = this.portionsList.find(p => p.name === this.selectedOptions.portion);
          if (portion) base += portion.price;

          let addonsSum = this.selectedOptions.addons.reduce((sum, addonId) => {
            let found = this.availableAddons.find(a => a.id === addonId);
            return sum + (found ? found.price : 0);
          }, 0);
          return (base + addonsSum) * this.modalQty;
        },

        confirmAddToCart() {
          let addonsList = this.selectedOptions.addons.map(id => {
            let found = this.availableAddons.find(a => a.id === id);
            return found ? found.name : id;
          });

          let itemTotal = this.calculateModalTotal() / this.modalQty;

          this.cart.push({
            dish: this.selectedDish,
            qty: this.modalQty,
            itemTotal: itemTotal,
            options: {
              portion: this.selectedOptions.portion,
              spice: this.selectedOptions.spice,
              addonsList: addonsList,
              notes: this.selectedOptions.notes
            }
          });

          this.modalOpen = false;
        },

        removeFromCart(index) {
          this.cart.splice(index, 1);
          if (this.cart.length === 0) {
            this.cartDrawerOpen = false;
          }
        },

        cartTotalCount() {
          return this.cart.reduce((sum, item) => sum + item.qty, 0);
        },

        // "1 Item" vs "2 Items" — singular only when the count is exactly 1. Arabic uses one
        // invariant word for the count label here (avoids Arabic's more complex dual/plural noun
        // rules for a small UI badge — this is the same simplification level as the rest of the
        // demo's Arabic strings).
        cartItemLabel() {
          const n = this.cartTotalCount();
          if (this.isArabic) return `${n} صنف`;
          return `${n} ${n === 1 ? 'Item' : 'Items'}`;
        },

        cartTotalPrice() {
          return this.cart.reduce((sum, item) => sum + (item.itemTotal * item.qty), 0);
        },

        sendWhatsAppOrder() {
          if (this.cart.length === 0) return;

          const subtotal = this.cartTotalPrice();
          const vat = subtotal * 0.05;
          const grandTotal = (subtotal + vat).toFixed(2);
          const ar = this.isArabic;

          // 1. Header & order context (cuisine label included since this build demos all three —
          // a real single-cuisine deployment would just drop the parenthetical). WhatsApp text
          // switches fully to Arabic when the Emirati skin is in Arabic mode — same Arabic-only
          // rule as on-screen text, so the restaurant receives an order they can read end to end.
          const cuisineLabel = this.cuisineList.find(c => c.id === this.currentCuisine)?.label || '';
          // orderType itself is always stored as a fixed English literal ('Dine-In'/'Takeaway'/
          // 'Delivery') regardless of language — see the orderType buttons in the cart drawer — so
          // comparisons below check that literal, while orderTypeDisplay is only for the printed text.
          const orderTypeDisplay = ar
            ? { 'Dine-In': this.t('dineIn'), 'Takeaway': this.t('takeaway'), 'Delivery': this.t('delivery') }[this.orderType] || this.orderType
            : this.orderType;
          let text = ar
            ? `🍽️ *طلب جديد — ${this.restaurant.name.toUpperCase()} (قائمة إماراتية)*\n`
            : `🍽️ *NEW ORDER — ${this.restaurant.name.toUpperCase()} (${cuisineLabel.toUpperCase()} MENU)*\n`;
          text += `-----------------------------------\n`;
          text += ar ? `📍 *نوع الخدمة:* ${orderTypeDisplay}\n` : `📍 *Service Type:* ${orderTypeDisplay}\n`;

          if (this.orderType === 'Dine-In') {
            text += ar ? `🪑 *الطاولة:* ${this.tableNumber}\n` : `🪑 *Table:* ${this.tableNumber}\n`;
          } else {
            const notSpecified = ar ? 'غير محدد' : 'Not specified';
            text += ar ? `👤 *الاسم:* ${this.customerName || notSpecified}\n` : `👤 *Name:* ${this.customerName || notSpecified}\n`;
            text += ar ? `📞 *الهاتف:* ${this.customerPhone || notSpecified}\n` : `📞 *Phone:* ${this.customerPhone || notSpecified}\n`;
            if (this.orderType === 'Delivery') {
              text += ar ? `🏠 *العنوان:* ${this.deliveryAddress || notSpecified}\n` : `🏠 *Address:* ${this.deliveryAddress || notSpecified}\n`;
            }
          }

          text += ar ? `\n📋 *ملخص الطلب:*\n` : `\n📋 *ORDER SUMMARY:*\n`;

          // 2. Loop & format itemized breakdown — dish name already carries the Arabic name when
          // the item was added to cart while isArabic was true (see confirmAddToCart / the display
          // layer note above), so item.dish.name is already correct for whichever language it was
          // added in.
          this.cart.forEach((item) => {
            const itemTotal = (item.itemTotal * item.qty).toFixed(2);
            text += `\n*${item.qty}x ${item.dish.name}* — AED ${itemTotal}\n`;
            if (item.options.portion) {
              text += ar ? `   └ _الحجم:_ ${item.options.portion}\n` : `   └ _Portion:_ ${item.options.portion}\n`;
            }
            text += ar ? `   └ _الحرارة:_ ${item.options.spice}\n` : `   └ _Spice:_ ${item.options.spice}\n`;
            if (item.options.addonsList.length > 0) {
              item.options.addonsList.forEach(addon => {
                text += ar ? `   └ _إضافة:_ ${addon}\n` : `   └ _Extra:_ ${addon}\n`;
              });
            }
            if (item.options.notes) {
              text += ar ? `   └ 💬 _ملاحظة:_ "${item.options.notes}"\n` : `   └ 💬 _Note:_ "${item.options.notes}"\n`;
            }
          });

          // 3. Financial summary
          text += `\n-----------------------------------\n`;
          if (ar) {
            text += `💵 *المجموع الفرعي:* AED ${subtotal.toFixed(2)}\n`;
            text += `🏛️ *ضريبة القيمة المضافة (٥٪):* AED ${vat.toFixed(2)}\n`;
            text += `💰 *المبلغ الإجمالي:* *AED ${grandTotal}*\n`;
            text += `-----------------------------------\n`;
            text += `الرجاء تأكيد حالة الطلب والوقت المتوقع.`;
          } else {
            text += `💵 *Subtotal:* AED ${subtotal.toFixed(2)}\n`;
            text += `🏛️ *VAT (5%):* AED ${vat.toFixed(2)}\n`;
            text += `💰 *TOTAL AMOUNT:* *AED ${grandTotal}*\n`;
            text += `-----------------------------------\n`;
            text += `Please confirm order status and estimated time.`;
          }

          // 4. Encode string & open link
          const encodedText = encodeURIComponent(text);
          window.open(`https://wa.me/${this.restaurant.whatsappNumber}?text=${encodedText}`, '_blank');
        },

        callToOrder() {
          window.location.href = `tel:+${this.restaurant.whatsappNumber}`;
        }
      }
    }
  </script>
</body>
</html>
